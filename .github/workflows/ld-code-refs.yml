# LaunchDarkly Code References (extra credit: integrations)
# On every push, scans the repo for flag keys and uploads where each flag is
# used, so LaunchDarkly's flag page shows the exact files and lines.
# Needs a repository secret LD_ACCESS_TOKEN (LaunchDarkly API token with
# Writer role, or a custom role that can update code references).
name: LaunchDarkly Code References
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  find-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 11 # needed to detect removed flag references
      - name: LaunchDarkly code references
        uses: launchdarkly/find-code-references@v2
        with:
          accessToken: ${{ secrets.LD_ACCESS_TOKEN }}
          projKey: pulse-demo
